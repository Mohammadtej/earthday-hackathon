<!DOCTYPE html>
<html lang="en">
<head>
    <title>Register - Snowflake Green Audit</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --border-color: #333;
            --primary-green: #2ea043;
            --primary-green-hover: #3fb950;
            --danger: #d32f2f;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            margin: 0;
            padding: 2rem;
        }
        .register-card {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        h2 { margin-top: 0; color: #fff; }
        .btn {
            background-color: var(--primary-green);
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1em;
            transition: background-color 0.2s, transform 0.1s;
            width: 100%;
            margin-top: 20px;
        }
        .btn:hover { background-color: var(--primary-green-hover); }
        .btn:active { transform: scale(0.98); }
        a { color: var(--primary-green); text-decoration: none; font-weight: bold; }
        a:hover { text-decoration: underline; }
        input[type="text"], input[type="password"], input[type="email"] {
            width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px;
            background-color: #252525; border: 1px solid var(--border-color);
            color: var(--text-color); border-radius: 4px; box-sizing: border-box;
        }
        input[type="text"]:focus, input[type="password"]:focus, input[type="email"]:focus {
            border-color: var(--primary-green); outline: none;
        }
        label { display: block; text-align: left; font-weight: bold; margin-bottom: 5px; }
        .helptext { font-size: 0.8em; color: #888; display: block; text-align: left; margin-top: -10px; margin-bottom: 15px; }
        ul.errorlist { color: var(--danger); text-align: left; padding-left: 20px; font-size: 0.9em; }
    </style>
</head>
<body>
    <div class="register-card">
        <h2>Create an Account</h2>

        {% if messages %}
            {% for message in messages %}
                <p style="color: red;">{{ message }}</p>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn">Sign Up</button>
        </form>

        <p>Already have an account? <a href="{% url 'login' %}">Log in here</a></p>
    </div>
</body>
</html>
